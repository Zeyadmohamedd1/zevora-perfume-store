<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cart</title>
    <link rel="icon" type="image/png" href="./img/logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">ZÉVORA</a>
            <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav  ms-4 gap-2">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="products.html">Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="index.html#about">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="index.html#contact">Contact</a>
        </li>
      </ul>
      <div class="d-flex align-items-center ms-lg-auto mt-3 mt-lg-0 nav-tools">
            <i class="bi bi-search me-3 p-1"></i>
            <input
            type="text"
            id="searchInput"
            class="form-control me-3 nav-search"
            placeholder="Search perfume..."
            >
            <a href="login.html" class="text-dark me-3">
            <i class="bi bi-person fs-5"></i>
        </a>
     </div>
        <div class="position-relative d-inline-block ms-3 mt-3 mt-lg-0">
    <a href="cart.html" class="text-dark">
        <i class="bi bi-cart"></i>
        </a>

    <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        0
    </span>
</div>
    </div>
  </div>
</nav>
<div class="container my-5">
    <h2 class="text-center mb-4">Your Cart</h2>
    <p id="emptyCart" class="text-center text-muted d-none">
    Your cart is empty 🛒</p>
    <div id="cartContainer" class="row g-4">
    </div>
    <template id="cartTemplate">

    <div  class="col-6 col-lg-4">

        <div class="card h-100">

            <img class="card-img-top cart-img">

            <div class="card-body">

                <h5 class="card-title cart-name"></h5>

                <p class="card-text cart-brand"></p>

                <p class="cart-rating"></p>

                <h5 class="cart-price text-success"></h5>
                <button class="btn btn-danger w-100 remove-cart">
                    Remove
                </button>
            </div>

        </div>

    </div>

</template>

</div>
<div class="fixed-bottom bg-white border-top p-3">
    <div id="cartSummary" class="container d-flex justify-content-end align-items-center gap-4">
        <span id="offerMessage" class="badge text-bg-success d-none">
            10% OFF 🎉
        </span>
        <div class="text-end">
            <p class="mb-1">
                Subtotal: $<span id="subTotal">0</span>
            </p>
            <p class="mb-1 text-danger">
                Discount: -$<span id="discount">0</span>
            </p>

            <h4 class="mb-0">
                Total: $<span id="totalPrice">0</span>
            </h4>

        </div>

    </div>

</div>

<div class="toast-container position-fixed top-0 end-0 p-3">

    <div id="offerToast"
         class="toast"
         role="alert"
         data-bs-delay="4000">

        <div class="toast-header">
            <strong class="me-auto">🎁 Today's Offer</strong>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="toast">
            </button>
        </div>

        <div class="toast-body">
            Spend more than $500 and get 10% OFF!
        </div>

    </div>

</div>

<script src="cart.js"></script>


</body>
</html>
