<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ZÉVORA</a>
            <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav  ms-4 gap-2">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Contact</a>
        </li>
      </ul>
      <div class="d-flex ms-auto">
            <i class="bi bi-search me-3 p-1"></i>
            <input
            type="text"
            id="searchInput"
            class="form-control me-3"
            placeholder="Search perfume..."
            style="width: 200px;">
            <i class="bi bi-person me-3"></i>
     </div>
        <div class="position-relative">
    <a href="cart.html" class="text-dark">
        <i class="bi bi-car"></i>
        </a>

    <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        0
    </span>
</div>
    </div>
  </div>
</nav>
<div class="container my-5">
    <h2 class="text-center mb-4">Your Cart</h2>
    <div id="cartContainer" class="row g-4">
    </div>
    <template id="cartTemplate">

    <div class="col-md-4">

        <div class="card h-100">

            <img class="card-img-top cart-img"
                 style="height: 250px; object-fit: contain;">

            <div class="card-body">

                <h5 class="card-title cart-name"></h5>

                <p class="card-text cart-brand"></p>

                <p class="cart-rating"></p>

                <h5 class="cart-price text-success"></h5>
                <button class="btn btn-danger w-100 remove-cart">
                    Remove
                </button>
            </div>

        </div>

    </div>

</template>
</div>

<script src="cart.js"></script>


</body>
</html>
